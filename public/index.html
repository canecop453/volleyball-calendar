<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volleyball Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f3;
    --surface: #ffffff;
    --surface2: #f0f0ee;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --accent: #1a1a2e;
    --accent-dim: rgba(26,26,46,0.08);
    --accent-highlight: #e8ff47;
    --text: #1a1a1a;
    --muted: #888;
    --sara: #c4327a;
    --sara-bg: rgba(196,50,122,0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo {
    font-family: 'Bebas Neue', cursive;
    font-size: 1.5rem;
    letter-spacing: 0.05em;
    color: var(--accent);
  }
  .logo span { color: #e8574a; }

  .nav-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .month-display {
    font-family: 'Bebas Neue', cursive;
    font-size: 1.25rem;
    letter-spacing: 0.08em;
    min-width: 160px;
    text-align: center;
    color: var(--text);
  }

  .btn {
    background: var(--surface);
    border: 1px solid var(--border2);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .btn:hover { border-color: rgba(0,0,0,0.3); background: var(--surface2); }
  .btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
  .btn.accent:hover { background: #2d2d4e; }

  .month-tabs {
    display: flex;
    gap: 4px;
    padding: 0.75rem 1.5rem;
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .month-tabs::-webkit-scrollbar { display: none; }

  .month-tab {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 20px;
    padding: 4px 12px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .month-tab:hover { border-color: var(--border2); color: var(--text); }
  .month-tab.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); font-weight: 500; }

  .cal-wrap { padding: 1.25rem 1.5rem; max-width: 960px; margin: 0 auto; }

  .day-headers {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    margin-bottom: 3px;
  }
  .day-hdr {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    padding: 6px 0;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }

  .day-cell {
    min-height: 90px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    overflow: hidden;
  }
  .day-cell:hover { border-color: var(--border2); background: var(--surface2); }
  .day-cell.empty { background: transparent; border-color: transparent; cursor: default; }
  .day-cell.today { border-color: #e8574a; }
  .day-cell.today .day-num { color: #e8574a; font-weight: 500; }

  .day-num {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 4px;
  }

  .event-chip {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    display: block;
    font-weight: 500;
    transition: opacity 0.15s;
  }
  .event-chip:hover { opacity: 0.75; }
  .chip-S { background: var(--sara-bg); color: var(--sara); border: 1px solid rgba(196,50,122,0.2); }

  .more-label {
    font-size: 10px;
    color: var(--muted);
    padding: 1px 4px;
  }

  .legend {
    display: flex;
    gap: 16px;
    padding: 0.75rem 1.5rem;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    background: var(--surface);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 1rem;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 1.5rem;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  }
  .modal-title {
    font-family: 'Bebas Neue', cursive;
    font-size: 1.25rem;
    letter-spacing: 0.05em;
    margin-bottom: 1.25rem;
    color: var(--accent);
  }
  .modal label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 5px;
    margin-top: 12px;
  }
  .modal label:first-of-type { margin-top: 0; }
  .modal input, .modal select, .modal textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border2);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 11px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  .modal input:focus, .modal select:focus, .modal textarea:focus {
    border-color: var(--accent);
  }
  .modal textarea { resize: vertical; min-height: 70px; }

  .modal-btns {
    display: flex;
    gap: 8px;
    margin-top: 1.25rem;
    justify-content: flex-end;
  }
  .btn-danger { color: #c0392b; border-color: rgba(192,57,43,0.3); }
  .btn-danger:hover { background: rgba(192,57,43,0.06); border-color: rgba(192,57,43,0.5); }

  .status {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    padding: 0.5rem 1.5rem;
  }

  @media (max-width: 600px) {
    .day-cell { min-height: 60px; padding: 4px; }
    .event-chip { font-size: 9px; }
    header { padding: 1rem; }
    .cal-wrap { padding: 0.75rem; }
    .month-display { font-size: 1rem; min-width: 120px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">⚡ Vball <span>Cal</span></div>
  <div class="nav-controls">
    <button class="btn" onclick="prevMonth()">&#8592;</button>
    <div class="month-display" id="monthDisplay"></div>
    <button class="btn" onclick="nextMonth()">&#8594;</button>
  </div>
</header>



<div class="month-tabs" id="monthTabs"></div>

<div class="cal-wrap">
  <div class="day-headers">
    <div class="day-hdr">Sun</div><div class="day-hdr">Mon</div><div class="day-hdr">Tue</div>
    <div class="day-hdr">Wed</div><div class="day-hdr">Thu</div><div class="day-hdr">Fri</div><div class="day-hdr">Sat</div>
  </div>
  <div class="days-grid" id="daysGrid"></div>
</div>

<div class="status" id="statusBar">Loading...</div>
<div id="modalContainer"></div>

<script>
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const START = { y: 2026, m: 10 };
const END   = { y: 2027, m: 10 };

let cur = { y: 2026, m: 10 };
let events = {};

async function loadEvents() {
  try {
    const r = await fetch('/api/events');
    events = await r.json();
    setStatus('Synced · ' + Object.keys(events).length + ' days with events');
  } catch { setStatus('Could not load events'); }
  render();
}

function setStatus(msg) {
  document.getElementById('statusBar').textContent = msg;
}

function dayKey(y, m, d) { return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0'); }

function buildTabs() {
  const c = document.getElementById('monthTabs');
  c.innerHTML = '';
  let y = START.y, m = START.m;
  while (y < END.y || (y === END.y && m <= END.m)) {
    const my = y, mm = m;
    const btn = document.createElement('button');
    btn.className = 'month-tab' + (y === cur.y && m === cur.m ? ' active' : '');
    btn.textContent = MONTHS[m].slice(0, 3) + ' \'' + String(y).slice(2);
    btn.onclick = () => { cur = { y: my, m: mm }; render(); };
    c.appendChild(btn);
    m++; if (m > 11) { m = 0; y++; }
  }
}

function render() {
  document.getElementById('monthDisplay').textContent = MONTHS[cur.m] + ' ' + cur.y;
  buildTabs();

  const grid = document.getElementById('daysGrid');
  grid.innerHTML = '';
  const firstDay = new Date(cur.y, cur.m, 1).getDay();
  const days = new Date(cur.y, cur.m + 1, 0).getDate();
  const today = new Date();

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'day-cell empty';
    grid.appendChild(el);
  }

  for (let d = 1; d <= days; d++) {
    const el = document.createElement('div');
    const k = dayKey(cur.y, cur.m, d);
    const isToday = today.getFullYear() === cur.y && today.getMonth() === cur.m && today.getDate() === d;
    el.className = 'day-cell' + (isToday ? ' today' : '');

    const num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = d;
    el.appendChild(num);

    const dayEvts = events[k] || [];
    dayEvts.slice(0, 3).forEach(ev => {
      const chip = document.createElement('div');
      chip.className = 'event-chip chip-' + (ev.who || 'B');
      chip.textContent = ev.title;
      chip.onclick = (e) => { e.stopPropagation(); openEdit(k, ev.id); };
      el.appendChild(chip);
    });
    if (dayEvts.length > 3) {
      const more = document.createElement('div');
      more.className = 'more-label';
      more.textContent = '+' + (dayEvts.length - 3) + ' more';
      el.appendChild(more);
    }

    el.onclick = () => openAdd(k, d);
    grid.appendChild(el);
  }

  const activeTab = document.querySelector('.month-tab.active');
  if (activeTab) activeTab.scrollIntoView({ block: 'nearest', inline: 'center' });
}

function stayPlayField(val) {
  return `
    <label>Stay and Play</label>
    <select id="mStayPlay">
      <option value=""${!val?' selected':''}>-- Select --</option>
      <option value="Yes"${val==='Yes'?' selected':''}>Yes</option>
      <option value="No"${val==='No'?' selected':''}>No</option>
    </select>`;
}

function qualifierField(val) {
  return `
    <label>Qualifier / Bid</label>
    <select id="mQualifier">
      <option value=""${!val?' selected':''}>-- Select --</option>
      <option value="Yes"${val==='Yes'?' selected':''}>Yes</option>
      <option value="No"${val==='No'?' selected':''}>No</option>
    </select>`;
}

function openAdd(dateKey, d) {
  showModal(`
    <div class="modal-title">Add Event — ${MONTHS[cur.m]} ${d}</div>
    <label>Title</label>
    <input type="text" id="mTitle" placeholder="Tournament, travel day, hotel check-in..." />
    <label>Location</label>
    <input type="text" id="mLocation" placeholder="City, venue..." />
    <label>Tournament Fee</label>
    <input type="text" id="mRegPrice" placeholder="e.g. $250" />
    ${stayPlayField('')}
    ${qualifierField('')}
    <label>Notes</label>
    <textarea id="mNote" placeholder="Hotel, flight, details..."></textarea>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn accent" onclick="addEvent('${dateKey}')">Add</button>
    </div>
  `, true);
}

function openEdit(dateKey, evId) {
  const ev = (events[dateKey] || []).find(e => e.id === evId);
  if (!ev) return;
  const parts = dateKey.split('-');
  const d = parseInt(parts[2]);
  showModal(`
    <div class="modal-title">Edit Event — ${MONTHS[parseInt(parts[1]) - 1]} ${d}</div>
    <label>Title</label>
    <input type="text" id="mTitle" value="${esc(ev.title)}" />
    <label>Location</label>
    <input type="text" id="mLocation" value="${esc(ev.location||'')}" placeholder="City, venue..." />
    <label>Tournament Fee</label>
    <input type="text" id="mRegPrice" value="${esc(ev.regPrice||'')}" placeholder="e.g. $250" />
    ${stayPlayField(ev.stayPlay||'')}
    ${qualifierField(ev.qualifier||'')}
    <label>Notes</label>
    <textarea id="mNote">${esc(ev.note||'')}</textarea>
    <div class="modal-btns">
      <button class="btn btn-danger" onclick="deleteEvent('${dateKey}','${evId}')">Delete</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn accent" onclick="updateEvent('${dateKey}','${evId}')">Save</button>
    </div>
  `);
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

async function addEvent(dateKey) {
  const title = document.getElementById('mTitle').value.trim();
  if (!title) return;
  const event = {
    title,
    who: 'S',
    location: document.getElementById('mLocation').value.trim(),
    regPrice: document.getElementById('mRegPrice').value.trim(),
    stayPlay: document.getElementById('mStayPlay').value,
    qualifier: document.getElementById('mQualifier').value,
    note: document.getElementById('mNote').value.trim()
  };
  closeModal();
  setStatus('Saving...');
  try {
    const r = await fetch('/api/events', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dateKey, event })
    });
    const data = await r.json();
    if (!events[dateKey]) events[dateKey] = [];
    events[dateKey].push(data.event);
    render();
    setStatus('Saved · ' + new Date().toLocaleTimeString());
  } catch { setStatus('Save failed — try again'); }
}

async function updateEvent(dateKey, evId) {
  const title = document.getElementById('mTitle').value.trim();
  if (!title) return;
  const update = {
    title,
    who: 'S',
    location: document.getElementById('mLocation').value.trim(),
    regPrice: document.getElementById('mRegPrice').value.trim(),
    stayPlay: document.getElementById('mStayPlay').value,
    qualifier: document.getElementById('mQualifier').value,
    note: document.getElementById('mNote').value.trim()
  };
  closeModal();
  setStatus('Saving...');
  try {
    await fetch('/api/events/' + dateKey + '/' + evId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(update)
    });
    const idx = (events[dateKey] || []).findIndex(e => e.id === evId);
    if (idx >= 0) events[dateKey][idx] = { ...events[dateKey][idx], ...update };
    render();
    setStatus('Saved · ' + new Date().toLocaleTimeString());
  } catch { setStatus('Save failed — try again'); }
}

async function deleteEvent(dateKey, evId) {
  closeModal();
  setStatus('Deleting...');
  try {
    await fetch('/api/events/' + dateKey + '/' + evId, { method: 'DELETE' });
    if (events[dateKey]) {
      events[dateKey] = events[dateKey].filter(e => e.id !== evId);
      if (!events[dateKey].length) delete events[dateKey];
    }
    render();
    setStatus('Deleted · ' + new Date().toLocaleTimeString());
  } catch { setStatus('Delete failed — try again'); }
}

function showModal(html, focusFirst) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.id = 'modalBg';
  bg.onclick = (e) => { if (e.target === bg) closeModal(); };
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = html;
  bg.appendChild(m);
  document.getElementById('modalContainer').appendChild(bg);
  if (focusFirst) setTimeout(() => { const el = document.getElementById('mTitle'); if (el) el.focus(); }, 50);
}

function closeModal() {
  const bg = document.getElementById('modalBg');
  if (bg) bg.remove();
}

function prevMonth() {
  if (cur.y === START.y && cur.m === START.m) return;
  cur.m--; if (cur.m < 0) { cur.m = 11; cur.y--; }
  render();
}

function nextMonth() {
  if (cur.y === END.y && cur.m === END.m) return;
  cur.m++; if (cur.m > 11) { cur.m = 0; cur.y++; }
  render();
}

loadEvents();
</script>
</body>
</html>
